# =============================================================================
# CI for grimms-monkeytype
#
# !!! IMPORTANT — re: tests !!!
# `bun run test` is intentionally NOT part of this workflow. The Vitest suite
# is currently known-flaky, and gating PRs on it produces noise rather than
# signal. Please do not add a test step here without first stabilizing the
# suite. See CONTRIBUTING.md ("Heads-up on the test suite") for context.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Format check (Biome)
        run: bun run format

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
