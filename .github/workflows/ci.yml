# CI for grimms-monkeytype
# Tests are CI-gated (vitest); see CONTRIBUTING.md for local workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Format check (Biome)
        run: bun run format

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test (Vitest)
        run: bun run test

      - name: Build
        run: bun run build
